services:
  docs:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    network_mode: host
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ${DOCS_SITE:?Run stack.py}:/usr/share/nginx/html:ro
      - ${DOCS_CONFIG:?Run stack.py}:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://${DOCS_HOST}:${DOCS_PORT}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
