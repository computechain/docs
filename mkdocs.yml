site_name: ComputeChain
site_description: Current devnet, architecture and development priorities
site_url: https://docs.computechain.space
repo_name: computechain/docs
repo_url: https://github.com/computechain/docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  features:
    - content.code.copy
    - navigation.top
  palette:
    scheme: default
    primary: indigo

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Run the devnet: devnet.md
  - Architecture: architecture.md
  - Development: development.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: Актуальный стенд, архитектура и приоритеты разработки
          nav_translations:
            Overview: Обзор
            Run the devnet: Запуск стенда
            Architecture: Архитектура
            Development: Разработка
